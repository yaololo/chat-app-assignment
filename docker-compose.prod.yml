services:
  server:
    ports: !reset []
    expose:
      - "3000"
    environment:
      CLIENT_ORIGIN: https://${DOMAIN}
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: