services:
  db:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_app}
      POSTGRES_USER: ${POSTGRES_USER:-chat_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chat_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chat_app}?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      PORT: 3000
      AUTH_SIGNING_SECRET: ${AUTH_SIGNING_SECRET:?Set a random AUTH_SIGNING_SECRET of at least 32 bytes in the root .env file}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
